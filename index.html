<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>우리 반 응원 뽑기</title>
  <style>
    :root { color-scheme: light; --ink: #170048; --green: #a400ed; --surface: #fff500; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: repeating-linear-gradient(35deg, #ff57b6 0 45px, #44ffe1 45px 90px, #c0ff00 90px 135px); color: var(--ink); font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; padding: 24px; }
    main { width: min(680px, 100%); background: var(--surface); border: 10px dashed #6b00ea; border-radius: 4px 80px 4px 80px; padding: clamp(28px, 6vw, 60px); box-shadow: 18px 18px 0 #ff00ae; }
    .eyebrow { color: #5a7756; font-size: 13px; letter-spacing: 0.13em; font-weight: 700; margin: 0 0 20px; }
    h1 { margin: 0; font-size: clamp(30px, 6vw, 42px); line-height: 1.3; letter-spacing: -0.05em; text-shadow: 3px 3px 0 #ff76be; }
    .intro { line-height: 1.8; color: #607064; margin: 18px 0 30px; }
    .message { display: grid; place-items: center; text-align: center; min-height: 150px; padding: 24px; border: 5px dotted #a400ed; border-radius: 18px; background: #7bff62; font-size: clamp(20px, 3.5vw, 25px); font-weight: 700; line-height: 1.65; word-break: keep-all; }
    button { display: block; width: 100%; margin-top: 24px; padding: 18px 20px; border: 0; border-radius: 14px; background: var(--green); color: #fff; font: 700 17px "Malgun Gothic", sans-serif; cursor: pointer; }
    button:hover { background: #174632; }
    button:focus-visible { outline: 3px solid #c17a12; outline-offset: 5px; }
    footer { margin-top: 26px; color: #778273; font-size: 12px; line-height: 1.7; text-align: center; }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">GROW TOGETHER · GITHUB PRACTICE</p>
    <h1>오늘도 도전하는 우리 반</h1>
    <p class="intro">잠깐 쉬어 가도 괜찮아요.<br>버튼을 눌러 오늘의 응원 한 문장을 만나 보세요.</p>
    <div id="message" class="message" role="status" aria-live="polite">당신의 다음 한 걸음을 응원합니다.</div>
    <button id="draw" type="button">응원 뽑기</button>
    <footer>연수용 실습 예제 · 입력한 개인정보 없이 이 브라우저에서만 작동합니다.</footer>
  </main>
  <script>
    const messages = [
      "작은 시도도 분명한 한 걸음입니다.",
      "처음이라 서툰 것은 자연스러운 일이에요.",
      "오늘 배운 한 가지가 내일의 힘이 됩니다.",
      "다시 시작할 수 있는 용기를 응원합니다.",
      "혼자 고민할 때는 함께 물어봐도 괜찮아요.",
      "천천히 가도, 지금 나아가고 있어요."
    ];
    let previous = -1;
    document.querySelector("#draw").addEventListener("click", () => {
      let next = Math.floor(Math.random() * messages.length);
      if (next === previous) next = (next + 1) % messages.length;
      previous = next;
      document.querySelector("#message").textContent = messages[next];
    });
  </script>
</body>
</html>
